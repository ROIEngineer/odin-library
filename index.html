<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Library</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
	<!-- MAIN -->
        <main>
	  <button id="new-book-btn">New Book</button>
          
          <dialog id="book-dialog">
	    <form method="dialog" id="dialog-form">
	      <h2>Add a new book</h2>
	      
	      <div class="book-items">
	        <label>
	          Title
	          <input type="text" name="title" id="dialog-title" required/>
	        </label>

                <label>
                  Author
                  <input type="text" name="author" id="dialog-author" required/>
                </label>

                <label>
                  Pages
                  <input type="number" name="pages" id="dialog-pages" min="1" required/>
                </label>

                <label>
                  Read
                  <input type="checkbox" name="read" id="dialog-read"/>
                </label>
	      </div>
	
              <menu>
		<button value="cancel" id="dialog-cancel" formnovalidate>Cancel</button>
	        <button type="submit" id="dialog-submit">Add Book</button>
	      </menu>
	    </form>
          </dialog>

          <!-- Container for cards -->
          <div id="library-container"></div>
        </main>
    </body>
</html>
